[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rebotarm-rl"
version = "0.1.0"
description = "reBotArm mjlab tasks, training configuration and policy evaluation"
requires-python = ">=3.12"
dependencies = ["mjlab==1.6.0", "numpy>=1.26", "torch>=2.7", "tensordict"]

[project.entry-points."mjlab.tasks"]
rebotarm_reach = "rebotarm_rl.tasks.reach"

[project.scripts]
rebotarm-rl-paired-eval = "rebotarm_rl.evaluation.paired_eval:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["rebotarm_rl*"]
