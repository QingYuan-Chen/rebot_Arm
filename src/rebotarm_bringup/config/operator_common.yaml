# 操作端公共参数:所有需要解析机械臂关节状态/目标的节点共享.
#
# 这里不放键盘,网页,示教或视觉策略参数.

/**:
  ros__parameters:
    # arm_namespace:话题,服务和动作名中的机械臂命名空间段.
    arm_namespace: rebotarm
    # 三个数组必须保持相同顺序;顺序也是轨迹和关节限位的顺序.
    joint_names:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
    # 仅作为 URDF 读取失败时的回退限位;真实软限位由硬件层独立维护.
    joint_lower_limits:
      - -3.14159
      - -3.14159
      - -3.14159
      - -3.14159
      - -3.14159
      - -3.14159
    joint_upper_limits:
      - 3.14159
      - 3.14159
      - 3.14159
      - 3.14159
      - 3.14159
      - 3.14159
