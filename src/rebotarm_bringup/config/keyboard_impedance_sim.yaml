# 终端键盘仿真专用关节阻抗初始参数与调参步长.
# 仅在 use_hardware:=false 时由 teleop_keyboard.launch.py 加载;
# 真机阻抗刚度/阻尼参数必须独立配置,严禁复用本文件.

/**:
  ros__parameters:
    impedance_profile: simulation
    impedance_initial_stiffness: [45.0, 45.0, 45.0, 17.5, 17.5, 17.5]
    impedance_initial_damping: [3.32, 5.0, 5.0, 1.28, 0.78, 0.34]
    impedance_max_stiffness: [500.0, 500.0, 500.0, 500.0, 500.0, 500.0]
    impedance_max_damping: [5.0, 5.0, 5.0, 5.0, 5.0, 5.0]
    impedance_kp_step: 2.0
    impedance_kd_step: 0.1
    impedance_q_step_rad: 0.02
