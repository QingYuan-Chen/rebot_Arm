# reBotArm 夹爪配置文件
#
# 用途:本包内的夹爪配置,由启动文件通过 gripper_config 参数传给硬件控制节点,
# 仅在打开真实硬件通道(use_hardware=true)时被读取.
#
# 文件结构(与厂商控制库的配置格式保持一致):
#   channel  - 总线/串口设备;
#   gripper  - 夹爪执行器列表,夹爪只有一个电机,因此只取列表第一项生效.

# 通信通道:串口设备路径.以 /dev/tty 开头时按串口桥处理(波特率 921600),
# 否则按 CAN 接口名(如 can0)处理;实际通道也可能被启动参数 channel 覆盖
channel: /dev/ttyACM0

gripper:
  - name: gripper
    motor_id: 0x07
    feedback_id: 0x17
    model: "4310"
    vendor: "damiao"
    MIT:
      kp: 8.0
      kd: 1.0
    POS_VEL:
      vel_kp: 0.0008
      vel_ki: 0.002
      pos_kp: 50.0
      pos_ki: 1.0
      vlim: 3.0
