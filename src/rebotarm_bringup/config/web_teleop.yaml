# 网页遥操作与本机 Dashboard 参数。
#
# 只提供网页 HTTP/SSE、网页关节点动和网页夹爪命令的约束。示教卡片所需的回放参数位于 teach_control.yaml，并由网页面板与示教节点共同加载，形成同一份工作流契约。

/**:
  ros__parameters:
    # Dashboard 只绑定本机回环地址；不要改成 0.0.0.0。
    host: 127.0.0.1
    port: 8088
    sse_rate_hz: 10.0

    # 网页执行总开关。真机 app launch 会根据显式 launch 参数覆盖它。
    web_execute_enabled: false
    web_execute_max_delta_rad: 1.5
    web_execute_min_duration: 1.0
    web_execute_max_duration: 8.0
    web_execute_max_joint_speed_rad_s: 1.5

    # 网页内“键盘点动”按钮的默认值和允许范围；与终端键盘参数故意分开。
    web_keyboard_default_step_rad: 0.02
    web_keyboard_min_step_rad: 0.005
    web_keyboard_max_step_rad: 0.10
    # 默认时长由节点按模式选取：legacy 0.2 s，prepared_v1 0.4 s。
    # 需要自定义时可显式设置 web_keyboard_default_duration，超限轨迹仍会拒绝。
    web_keyboard_min_duration: 0.1
    web_keyboard_max_duration: 2.0
    web_keyboard_default_speed_rad_s: 0.5

    # 网页夹爪命令的开口范围（m）与力矩限制。
    gripper_lower_limit_m: 0.0
    gripper_upper_limit_m: 0.09
    web_gripper_max_effort: 1.0
    web_gripper_max_effort_limit: 1.5
