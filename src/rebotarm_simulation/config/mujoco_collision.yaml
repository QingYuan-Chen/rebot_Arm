schema_version: 1
visual_group: 2
collision_group: 3

# Collision geoms are expressed in each URDF link frame.  Arm primitives are
# deliberately a little smaller than the visual envelope to avoid false
# contacts around adjacent joint housings. Each moving jaw has separate drive,
# mount and soft-finger convex hulls, avoiding a hull spanning the entire jaw.
# The soft finger is a rigid approximation; see soft_gripper_model.md.
bodies:
  base_link:
    - {name: base, type: box, pos: [0.0, 0.0, 0.0438], size: [0.068, 0.098, 0.043]}
  link1:
    - {name: housing, type: capsule, fromto: [0.0067, 0.0, 0.015, 0.0067, 0.0, 0.060], size: [0.025]}
  link2:
    - {name: upper_arm, type: capsule, fromto: [-0.255, 0.0, -0.0316, -0.015, 0.0, -0.0316], size: [0.026]}
  link3:
    - {name: forearm, type: capsule, fromto: [0.030, -0.030, -0.0311, 0.180, -0.030, -0.0311], size: [0.025]}
  link4:
    - {name: wrist_arm, type: capsule, fromto: [0.015, -0.030, -0.030, 0.080, -0.030, -0.030], size: [0.028]}
  link5:
    - {name: wrist_pitch, type: capsule, fromto: [-0.0028, 0.0, 0.012, -0.0028, 0.0, 0.060], size: [0.027]}
  link6:
    - {name: wrist_roll, type: cylinder, pos: [0.0, 0.0, 0.0242], size: [0.032, 0.028]}
  end_link:
    - {name: gripper_base, type: box, pos: [-0.090, 0.0, 0.0], size: [0.016, 0.075, 0.025]}
  left_finger_link:
    - {name: drive, type: mesh, mesh: left_finger, friction: [0.8, 0.02, 0.001]}
    - {name: mount, type: mesh, mesh: left_soft_gripper_mount, friction: [0.8, 0.02, 0.001]}
    - {name: finger, type: mesh, mesh: left_soft_gripper_finger, friction: [1.2, 0.02, 0.001]}
  right_finger_link:
    - {name: drive, type: mesh, mesh: right_finger, friction: [0.8, 0.02, 0.001]}
    - {name: mount, type: mesh, mesh: right_soft_gripper_mount, friction: [0.8, 0.02, 0.001]}
    - {name: finger, type: mesh, mesh: right_soft_gripper_finger, friction: [1.2, 0.02, 0.001]}
  # D405 tray walls remain separate so the cavity is not a solid hull.
  d405_mount_link:
  - name: floor
    type: box
    pos: [0.0, 0.06988197974301359, -0.013990114624156572]
    quat: &id001 [0.9914450660046141, 0.130524637885368, 0.0, 0.0]
    size: [0.023, 0.023, 0.0035]
  - name: left_wall
    type: box
    pos: [-0.02225, 0.06703500356209688, -0.003364921608248913]
    quat: *id001
    size: [0.00075, 0.0215, 0.0075]
  - name: right_wall
    type: box
    pos: [0.02225, 0.06703500356209688, -0.003364921608248913]
    quat: *id001
    size: [0.00075, 0.0215, 0.0075]
  - name: front_wall
    type: box
    pos: [0.0, 0.08943272731092905, -0.0009870084746379966]
    quat: *id001
    size: [0.0215, 0.00075, 0.011]
  - name: back_wall
    type: box
    pos: [0.0, 0.04661319945682117, -0.012460322483732357]
    quat: *id001
    size: [0.0215, 0.0009, 0.011]
  - name: wrist_base
