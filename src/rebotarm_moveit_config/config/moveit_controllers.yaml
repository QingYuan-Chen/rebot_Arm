# MoveIt 轨迹执行（Execute）用的控制器映射。
#
# 关键作用：MoveIt 的 Execute 阶段必须通过本文件声明的控制器管理器把规划好的轨迹发出去；
# 只把规划参数配好、没有本文件，Plan 会成功而 Execute 直接失败。因此本文件是"能真正动起来"
# 的必要条件，绝不是可选装饰。
#
# 名字解析规则（读代码时最容易搞错的地方）：MoveIt 按
#   <controller_name>/<action_ns> 组成动作名
# 去查找 FollowJointTrajectory 动作服务端，因此 controller_names 里的 rebotarm（对应节点
# 命名空间 /rebotarm）与 action_ns: follow_joint_trajectory 组合出的目标动作是
# /rebotarm/follow_joint_trajectory —— 这正是真机控制器与仿真轨迹控制器对外提供的动作名。
# 改这里的名字必须同步改控制器侧的名字，否则 MoveIt 会报找不到控制器。
moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  # 参与执行的全部控制器名字；列表里的项必须能在下面找到同名分组。
  controller_names:
    - rebotarm
    - rebotarm/gripper

  # 六轴机械臂控制器分组。
  rebotarm:
    # 控制器接口类型：标准 FollowJointTrajectory 动作（关节空间轨迹跟踪）。
    type: FollowJointTrajectory
    # 动作命名空间，与控制器名拼接成 /rebotarm/follow_joint_trajectory。
    action_ns: follow_joint_trajectory
    # 是否作为默认控制器：规划组没有显式指定控制器时使用它。
    default: true
    # 该控制器负责的关节，顺序与控制器期望的轨迹关节顺序一致，名称必须与 URDF/SRDF 完全一致。
    # FJT 仅负责完整六轴；夹爪通过独立位置接口执行。
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6

  rebotarm/gripper:
    type: GripperCommand
    action_ns: moveit_command
    default: true
    joints:
      - left_finger_joint
