# 3D 传感器(深度相机 / 点云)配置.
#
# 本仓库的规划场景**不接深度传感器**:列表里只放一个占位条目 no_depth_sensor,
# 且其 sensor_plugin 写成 "~"(表示不加载任何占用栅格/点云插件).
# 这样 move_group 能拿到一个合法但为空的 3D 传感器配置,不会因缺少 sensors_3d 参数而启动报错,
# 同时也不会引入任何点云处理开销.
#
# 安全含义:因为没有实时点云,MoveIt 的碰撞检查只依赖 URDF/SRDF 中的碰撞几何与显式附加的
# 碰撞物体,看不见环境里未建模的障碍.真实抓取前的环境安全由视觉/运动层自己的检查负责,
# 不能假定本文件的占位配置提供了环境避障能力.
sensors:
  # 启用的传感器名列表;这里只有占位项,扩容时必须同时补下面同名分组.
  - no_depth_sensor

# 与列表项同名的占位分组.
no_depth_sensor:
  # "~" 表示没有实际插件(等价于禁用),自定义插件类名写在这里才会启用点云输入.
  sensor_plugin: "~"
