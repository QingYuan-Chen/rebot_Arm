# MoveIt 规划用关节限位（本文件是"规划 / 执行守卫"速度-加速度-加加速度上限的唯一来源）。
#
# 读法：顶层键 joint_limits 下按关节名分组，每个关节用 has_<量>_limits 开关决定该项是否
# 生效，再由 max_<量> 给出上限——开关为 false 或字段缺失时，该关节在该维度上是"无限制"
# 而不是"限制为 0"。运动层的运行时守卫会直接加载本文件，缺任一被检查关节即报错，
# 因此新增关节时必须在这里同步补条目。
#
# 单位约定（与 MoveIt 一致）：
# - 旋转关节 joint1..joint6：max_velocity 为 rad/s，max_acceleration 为 rad/s^2，
#   max_jerk 为 rad/s^3；
# - 移动关节 left/right_finger_joint（夹爪开合）：三个量分别为 m/s、m/s^2、m/s^3。
#
# 量级说明：这里的值有意小于 URDF 的 velocity 属性（旋转关节 URDF 为 50，夹爪与 URDF 一致
# 为 0.2）。URDF 的 velocity 表达固件/硬件的物理上限，本文件表达允许规划器与执行守卫使用
# 的保守上限，测试会断言本文件的值不超过 URDF 值。调大即放宽规划速度与执行期保护，调小则
# 更保守（更慢，也更可能触发执行超时）。
#
# 联动关系：max_jerk 只有在 AddRuckigTrajectorySmoothing 响应适配器启用时才起作用（见
# ompl_planning.yaml 的 response_adapters）；省略 jerk 字段的关节（两个手指关节）在
# Ruckig 平滑与运行时校验中按"不限制加加速度"处理。
joint_limits:
  # joint1..joint3 位于大臂负载链上，速度上限统一取 3.0 rad/s。
  joint1:
    # 是否启用速度上限；false 时忽略同一分组内的 max_velocity
    has_velocity_limits: true
    # 关节角速度上限；单位 rad/s
    max_velocity: 3.0
    # 是否启用加速度上限；false 时忽略同一分组内的 max_acceleration
    has_acceleration_limits: true
    # 关节角加速度上限；单位 rad/s^2
    max_acceleration: 5.0
    # 是否启用加加速度上限；只有 Ruckig 平滑生效时才有实际约束力
    has_jerk_limits: true
    # 关节角加加速度上限；单位 rad/s^3
    max_jerk: 20.0
  # joint2 与 joint1 同构，限位相同。
  joint2:
    has_velocity_limits: true
    max_velocity: 3.0
    has_acceleration_limits: true
    max_acceleration: 5.0
    has_jerk_limits: true
    max_jerk: 20.0
  # joint3 与 joint1 同构，限位相同。
  joint3:
    has_velocity_limits: true
    max_velocity: 3.0
    has_acceleration_limits: true
    max_acceleration: 5.0
    has_jerk_limits: true
    max_jerk: 20.0
  # joint4..joint6 是腕部三个关节，惯量小但转角分辨率要求高，速度上限收紧到 1.8 rad/s
  # （约 103 deg/s），加速度与加加速度仍沿用 5.0 / 20.0。
  joint4:
    has_velocity_limits: true
    max_velocity: 1.8
    has_acceleration_limits: true
    max_acceleration: 5.0
    has_jerk_limits: true
    max_jerk: 20.0
  # joint5 与 joint4 同构，限位相同。
  joint5:
    has_velocity_limits: true
    max_velocity: 1.8
    has_acceleration_limits: true
    max_acceleration: 5.0
    has_jerk_limits: true
    max_jerk: 20.0
  # joint6 与 joint4 同构，限位相同。
  joint6:
    has_velocity_limits: true
    max_velocity: 1.8
    has_acceleration_limits: true
    max_acceleration: 5.0
    has_jerk_limits: true
    max_jerk: 20.0
  # 夹爪两指是 prismatic 关节：URDF 限位为左指 [0.0, 0.045] m、右指 [-0.045, 0.0] m。
  # 这里只给速度 0.2 m/s 与加速度 0.5 m/s^2，**不启用 jerk 限制**，因为夹爪由单路开度
  # 反馈驱动、不做轨迹平滑；缺 max_jerk 会让加载器把该维度判为 None（无限制）。
  # 两指限位必须保持一致，否则左右指运动不同步会造成夹爪模型干涉。
  left_finger_joint:
    has_velocity_limits: true
    # 手指平移速度上限；单位 m/s（与 URDF 该关节的 velocity 一致）
    max_velocity: 0.2
    has_acceleration_limits: true
    # 手指平移加速度上限；单位 m/s^2
    max_acceleration: 0.5
  # right_finger_joint 与 left_finger_joint 镜像，限位相同（方向由 URDF 的 axis 决定）。
  right_finger_joint:
    has_velocity_limits: true
    max_velocity: 0.2
    has_acceleration_limits: true
    max_acceleration: 0.5
