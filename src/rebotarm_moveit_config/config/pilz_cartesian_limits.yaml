# Pilz 工业运动规划器的笛卡尔运动约束（卡式坐标限位）。
#
# 用途：当规划流水线使用 Pilz 的 LIN / CIRC / PTP 规划器时，这些键限制末端在笛卡尔空间里
# 直线/圆弧运动的速度与加速度，防止"姿态对但速度过快"的笛卡尔轨迹通过规划。
#
# 当前状态提醒：本仓库的活动流水线只有 OMPL（见 ompl_planning.yaml 的 planning_plugins，
# 演示启动文件也只启用 ompl 一条流水线），因此本文件目前不被任何启动流程加载，
# 属于为将来接入 Pilz 预留的标准配置骨架；修改它不会立刻改变真机行为。
cartesian_limits:
  # 末端最大平移速度；单位 m/s。0.3 约等于 30 cm/s，是保守的调试级速度。
  max_trans_vel: 0.3
  # 末端最大平移加速度；单位 m/s^2。调大启动/停止更"猛"，调小更柔和但更慢。
  max_trans_acc: 0.5
  # 末端最大平移减速度；单位 m/s^2。与加速度分开配置，便于让减速比加速更保守。
  max_trans_dec: 0.5
  # 末端最大旋转角速度；单位 rad/s（Pilz 文档中该字段也可按 deg/s 理解，本仓库按
  # MoveIt/Pilz 该字段的官方定义使用，未做额外换算）。1.0 约为 57 deg/s。
  max_rot_vel: 1.0
