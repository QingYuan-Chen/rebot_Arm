# 运动学求解器（IK）配置：按规划组名分组，arm 规划组使用 KDL 数值逆解插件。
#
# 该求解器用于"给定位姿求关节角"的场景（RViz 拖动交互、末端位姿规划、可达性预检）。
# 本文件由 MoveItConfigsBuilder 以 robot_description_kinematics 类别加载，
# 键名与插件名都不能改，写错会表现为"找不到运动学求解器"。
arm:
  # MoveIt 默认的串联链数值逆解插件：基于雅可比迭代，无解析解依赖，通用但对奇异位形敏感。
  # MoveIt docs use the KDL plugin as the default serial-chain IK backend.
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  # 关节空间搜索分辨率（无量纲比例，约等于每次迭代在关节空间推进的比例）：
  # 0.005 偏精细，求解更准但更慢；调大加速搜索但可能错过可行解。
  kinematics_solver_search_resolution: 0.005
  # 单次求解的超时时间，单位 s。0.05 很短，适合交互式拖动（宁可快速失败也不卡住 UI）；
  # 若出现频繁"找不到 IK"，优先考虑调大该值，而不是降低分辨率。
  kinematics_solver_timeout: 0.05
  # 随机重启尝试次数：超时后换随机初值重试的次数。0.05 s x 3 次构成总的求解预算，
  # 调大能提高成功率但会线性增加最坏耗时，进而影响规划节拍。
  kinematics_solver_attempts: 3
