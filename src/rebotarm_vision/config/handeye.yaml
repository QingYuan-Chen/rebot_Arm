# 历史 Gemini2 手眼标定原始记录，保留数值供追溯；D405 入口已撤下此默认文件。
# D405 需重新标定，并通过 handeye_config / vision_handeye_config 显式加载新文件。
# 上游手眼标定参数 / Upstream hand-eye calibration parameters。
# 来源：/home/a/project/rebot_refer，提交号
# 152f8f14ceec5cc8fc61664ff63915187a412800。
#
# 坐标约定：ROS TF 中使用 end_link -> camera_depth_frame 这条静态变换；
# 对齐 RGB-D 链路用彩色内参做反投影，因此**不允许**再叠加一次
# 出厂彩色/深度外参，否则深度会二次校正而错位。
# 注意：本文件中的键名与坐标系名都是对外接口，禁止改动；只允许增加注释。
handeye:
  # 父坐标系：机械臂末端连杆，平移/旋转都是相对该系描述
  parent_frame: end_link
  # 子坐标系：深度相机光学坐标系（与深度图消息的 frame_id 一致）
  child_frame: camera_depth_frame
  # 子坐标系原点在父坐标系中的平移，单位 m
  translation:
    # 沿末端 X 轴偏移（-0.085 m，相机位于法兰后方 8.5 cm）
    x: -0.085000000
    # 沿末端 Y 轴偏移（0.010 m，1 cm 的横向安装偏差）
    y: 0.010000000
    # 沿末端 Z 轴偏移（0.045 m，相机高于法兰 4.5 cm）
    z: 0.045000000
  # 父坐标系到子坐标系的姿态：四元数 (x, y, z, w)，均无量纲，模长应约为 1
  rotation:
    x: -0.523092811
    y: 0.578134825
    z: -0.405717914
    w: 0.476997914
