# 实验性配置：接近段视觉伺服与计划刷新参数，由上层启动组合包加载到视觉抓取执行节点
# （rebotarm_visual_grasp_executor）。
# 当前正式视觉运行链路不启用本功能；两组开关均保持关闭，保证默认行为是
# "一次规划、一次到位"的可复现路径。只有完成独立的 plan-only 验证后，才应显式开启。
# 注意：本文件中的参数键都是对外接口，禁止改动；只允许增加注释。
rebotarm_visual_grasp_executor:
  ros__parameters:
    # plan_only（只规划干跑）模式下各阶段之间的诊断等待（单位 s）。
    # 完整轨迹会在所有阶段规划成功后一次发送给 RViz，因此默认无需停顿。
    plan_only_stage_pause_sec: 0.0
    # 是否在到达接近点后等待更新版本的抓取计划（近距离视觉更准）。
    # 实验性功能；正式链路默认关闭。执行节点内部默认值为 true，本档显式置 false。
    refresh_plan_at_pregrasp_enabled: false
    # 计划刷新是否为强制要求：开启且等不到新计划时本次尝试直接判失败（而不是沿用旧计划）。
    # 只有 refresh_plan_at_pregrasp_enabled 为真时才有意义。
    refresh_plan_at_pregrasp_required: false
    # 等待新抓取计划的最长时间（单位 s）；超时按上面的"是否强制"决定失败还是沿用旧计划
    refresh_plan_timeout_sec: 1.0
    # 实验性功能：是否用"迭代小步逼近 + 每步纠偏"替代一次到位的 approach_grasp。
    # 默认 false；打开后接近节拍变长，并依赖持续可用的视觉更新。
    approach_visual_servo_enabled: false
    # 视觉伺服最大迭代步数（至少为 1）。调大更可能收敛到位，但接近段耗时成比例增加。
    approach_visual_servo_max_iterations: 5
    # 单步最大位移（单位 m，0.02 = 2 cm）；限制每步风险，调大更快但更接近"一次到位"的碰撞风险
    approach_visual_servo_max_step_m: 0.02
    # 位置误差容差（单位 m，0.008 = 8 mm）；当前点到目标点距离小于它即认为已到位
    approach_visual_servo_position_tolerance_m: 0.008
    # 是否要求每一步都基于"更新的"抓取计划。默认 true；
    # 置 false 后允许沿用最近一次计划，视觉一旦不更新就会出现带偏差的盲走。
    approach_visual_servo_require_fresh_plan: true
