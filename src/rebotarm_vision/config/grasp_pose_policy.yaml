# 抓取姿态与候选筛选策略参数（按节点名分组）。
# 由上层启动组合包按 profile 直接作为参数文件加载；同一个键在不同节点下的取值不同是正常的
# （例如 pose_policy 在候选过滤节点用混合策略、在执行器里用 base_axis），改动前先确认属于哪个节点。
# 所有长度为米、角度为弧度、四元数顺序为 (x, y, z, w)；只允许增加注释，禁止改键名或数值。

rebotarm_grasp_candidate_ik_filter:
  ros__parameters:
    # 正式候选姿态策略：完整保留 GraspNet 输出的 6D 姿态，仅按配置补充平行夹爪对称姿态。
    pose_policy: preserve_candidate_pose
    # 固定抓取姿态四元数 (x, y, z, w)：沿用旧仓库 +X 工作区的单位姿态。
    # 这是"夹爪朝哪一边"的基准姿态，改动会让所有抓取姿态整体转向。
    fixed_grasp_orientation_xyzw: [0.0, 0.0, 0.0, 1.0]
    # 在 base_link 下的接近轴方向单位向量：末端沿 +X 方向接近物体。
    # 与 fixed_grasp_orientation_xyzw 是同一安装朝向的两种表达，需保持一致。
    base_approach_axis_xyz: [1.0, 0.0, 0.0]
    # 预抓取点沿接近轴后退的距离，单位米（0.08 m = 8 cm）。调大更保守但空行程变长。
    base_pregrasp_distance_m: 0.08
    # 额外尝试的绕接近轴偏航角列表，单位弧度。[0.0] 表示只试基准朝向；
    # 增加元素（如 ±pi/2）会让同一候选生成多个姿态变体，代价是 IK/碰撞检查次数成倍增加。
    orientation_yaw_offsets_rad: [0.0]
    # 额外尝试的抓取点 Z 偏移列表，单位米。[0.0] 表示只试原始高度；
    # 增加元素可用于在深度有偏差时上下试探，同样会成倍增加检查次数。
    candidate_grasp_z_offsets_m: [0.0]
    # 每帧最多处理的候选数（上限，防止单帧候选过多拖垮 IK 服务）。调大更全面但更慢。
    max_candidates_per_frame: 20
    # 候选最低置信度阈值（0~1，来自检测/抓取网络）；低于该值的候选直接跳过。
    candidate_min_confidence: 0.4
    # 候选所需夹爪开度下限，单位米（0.006 m = 6 mm）；过小说明夹爪几乎闭合，视为无效。
    candidate_min_jaw_width_m: 0.006
    # 候选所需夹爪开度上限，单位米（0.085 m = 85 mm，接近夹爪最大行程）；超过即夹不住。
    candidate_max_jaw_width_m: 0.085
    # 抓取点最低高度，单位米；0.0 表示不高于工作坐标系地面即可（防撞台面的保守门限）。
    candidate_min_grasp_z_m: 0.0
    # 预抓取目标在 base_link 下的 Z 下限（0.04 m = 4 cm）；
    # 低于时抬高到该值；不是相对桌面的净空高度，仍需碰撞检查。
    candidate_pregrasp_min_z_m: 0.04
    # 是否启用工作空间包围盒闸门，false 表示不按坐标范围过滤候选（当前默认关闭）。
    candidate_workspace_gate_enabled: false
    # 包围盒最小角点 (x, y, z)，单位米，仅在上一项为 true 时生效。
    # 旧仓库的区间是 x∈[0.18,0.64]、y∈[-0.35,0.35]，即以前方 +X 为主。
    candidate_workspace_min_xyz: [0.18, -0.35, 0.0]
    # 包围盒最大角点 (x, y, z)，单位米，与上一项成对使用。
    candidate_workspace_max_xyz: [0.64, 0.35, 0.45]
    # 抓取点到物体中心的最大允许距离，单位米（0.15 m = 15 cm）；
    # 防止抓取点落到物体轮廓之外（深度分割边缘的离群点）。仅在闸门启用且该值 > 0 时生效。
    candidate_max_grasp_to_object_center_m: 0.15
    # 运动代价中"全体关节角差二范数"的权重，默认 0.15；调大更偏好动作幅度小的候选。
    candidate_score_joint_distance_weight: 0.15
    # 运动代价中 joint6（末轴）角差的额外权重，默认 0.35；调大更强烈地避免末轴旋转。
    candidate_score_joint6_weight: 0.35
    # joint6 单关节最大允许角差，单位弧度（1.5708 ≈ 90°）；超过直接否决该候选，
    # 因为末轴大角度翻转会让夹爪绕着物体甩过去，有碰撞与线缆风险。
    candidate_max_joint6_delta_rad: 1.5708
    # 是否启用 joint6 对称性补偿：夹爪绕自身开合轴对称，theta 与 theta+pi 等价。
    candidate_joint6_symmetry_enabled: true
    # joint6 对称角，单位弧度（3.141592653589793 = pi）。启用对称性后，
    # 对超出阈值的 joint6 角差会尝试 ±pi 折叠，取更省行程的那个解。
    candidate_joint6_symmetry_angle_rad: 3.141592653589793
    # end_link -> 抓取 TCP 的平移，单位米（沿末端 X 轴 -4 cm）。
    # 必须与 rebotarm_grasp_tcp_frame 节点及实测标定保持一致，否则抓取点整体偏移。
    tcp_offset_xyz: [-0.04, 0.0, 0.0]
    # 目标点在工作坐标系中的整体平移补偿 (x, y, z)，单位米。
    # 用于修正安装/标定残差；[0.0, 0.0, 0.0] 表示不做平移补偿。
    target_base_offset_xyz: [0.0, 0.0, 0.0]
    # 抓取位姿在 base Z 方向的额外偏移，单位米；0.0 表示抓取点取深度反投影的原始高度，
    # 调正会让抓取点整体抬高（例如物体易被压扁时）。
    grasp_base_z_offset_m: 0.0

rebotarm_visual_grasp_executor:
  ros__parameters:
    # 执行器使用的姿态策略：base_axis = 只按 base 接近轴构造抓取姿态，
    # 不采用候选自身几何（执行阶段要求姿态确定、可复现）。
    pose_policy: base_axis
    # 固定抓取姿态四元数 (x, y, z, w)，含义同候选过滤节点的同名参数（绕 Z 转 -90°）。
    fixed_grasp_orientation_xyzw: [0.0, 0.0, 0.0, 1.0]
    # 接近轴方向单位向量（base_link 下的 +X）。
    base_approach_axis_xyz: [1.0, 0.0, 0.0]
    # 预抓取点沿接近轴后退的距离，单位米（0.08 m = 8 cm）。
    base_pregrasp_distance_m: 0.08
    # 允许的最低抓取高度，单位米；低于此值拒绝执行（防撞台面的硬门限）。
    min_grasp_z_m: 0.0
    # end_link -> 抓取 TCP 的平移，单位米（沿末端 X 轴 -4 cm），含义同上。
    tcp_offset_xyz: [-0.04, 0.0, 0.0]
    # 目标点整体平移补偿，单位米；全 0 表示不补偿。
    target_base_offset_xyz: [0.0, 0.0, 0.0]
    # 抓取位姿的 base Z 额外偏移，单位米；0.0 表示不偏移。
    grasp_base_z_offset_m: 0.0

rebotarm_grasp_preview_sender:
  ros__parameters:
    # 预览发送的位姿模式：pregrasp 表示发送预抓取位姿（更安全，末端不贴住物体）；
    # 另一可选值为抓取位姿，用于细看夹爪闭合点。
    pose_mode: pregrasp
    # 预览目标坐标系（TF 目标 frame），抓取位姿会被换算到该坐标系后再发送。
    target_frame: base_link
    # end_link -> 抓取 TCP 的平移，单位米（沿末端 X 轴 -4 cm），用于把位姿换算到 TCP。
    tcp_offset_xyz: [-0.04, 0.0, 0.0]
    # 目标点整体平移补偿，单位米；全 0 表示不补偿。
    target_base_offset_xyz: [0.0, 0.0, 0.0]
    # 预览目标的最低 Z 高度，单位米；大于 0 时会把目标点抬高到该值（安全下限），
    # 0.0 表示不做下限抬升。
    min_target_z_m: 0.0

rebotarm_visual_grasp_markers:
  ros__parameters:
    # 标记发布的参考坐标系（RViz 中各标记的 frame_id）。
    target_frame: base_link
    # 物体标记的最小直径，单位米（0.06 m = 6 cm）：小于该值的物体标记会被放大到该值，
    # 纯粹为了在 RViz 里看得见，不影响真实抓取尺寸。
    object_min_diameter_m: 0.06
    # 物体标记的最小高度，单位米（0.12 m = 12 cm）：同理，仅用于可视化下限。
    object_min_height_m: 0.12
    # 是否把物体标记绘制成"竖直立起"（忽略候选姿态的倾斜），便于观察物体位置；false 时按候选姿态绘制。
    upright_object_marker: true
    # 标记上叠加的 TCP 偏移，单位米；全 0 表示标记直接画在原始位姿上，不换算到抓取 TCP。
    tcp_offset_xyz: [0.0, 0.0, 0.0]
    # 夹爪开合轴在末端/夹爪局部坐标系中的方向向量；用于画出开合方向的指示。
    # [0.0, 1.0, 0.0] 表示局部 Y 轴为开合方向（本夹爪的实际安装方向）。
    gripper_open_axis_local_xyz: [0.0, 1.0, 0.0]
    # 是否显示 TCP 标记（预抓取/抓取两处）。
    show_tcp_markers: true
    # 是否显示接近方向箭头。
    show_approach_arrow: true
    # 是否显示夹爪开合轴指示。
    show_gripper_open_axis: true
