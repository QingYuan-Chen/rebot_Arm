# 夹爪抓取策略参数：由上层启动组合包加载到视觉抓取执行节点
# （rebotarm_visual_grasp_executor），决定开/合爪宽度与夹持力的解算结果。
# 解算逻辑见 gripper_policy.py：物体宽度超过上限即 fail-closed 拒绝该次抓取；
# 夹持力恒取 close_max_effort 并截断到 [min_gripper_effort, max_gripper_effort]。
# 注意：本文件中的参数键都是对外接口，禁止改动；只允许增加注释。
# visual_grasp_system.launch.py 仍保留同名参数作为兼容覆盖入口；其默认值必须与本档一致。
rebotarm_visual_grasp_executor:
  ros__parameters:
    # 固定合爪目标位置（两指间距，单位 m）。auto_gripper_width 为真且测得有效物体宽度时
    # 会被自适应结果覆写；数值过大夹不住目标，过小可能夹到空行程。0.025 m 是默认握持量。
    close_position_m: 0.025
    # 合爪阶段允许的最大夹持力（归一化量纲，非牛顿）；本仓库夹爪约定 0~0.6。
    # 调大夹得更紧但可能压坏目标，调小可能夹不牢而滑落。
    close_max_effort: 0.4
    # 是否在接近目标前先张开夹爪。默认 true 会提前占用目标上方空间；
    # 狭窄场景可置 false，改为到达接近点后再张开。
    open_before_approach: true
    # 是否按检测到的物体宽度自动推算开/合爪宽度（上限受 max_allowed_grasp_width_m 约束）。
    # 置 false 时完全使用上面的固定宽度。
    auto_gripper_width: true
    # 自动夹持力开关。当前实现不参与计算（合力始终取 close_max_effort），
    # 保留该键仅为与节点参数对齐。
    auto_gripper_effort: true
    # 开爪宽度在物体宽度基础上额外留的余量（单位 m）。默认 0.0 表示与物体等宽；
    # 留太小接近时容易刮碰目标，留太大会让夹爪提前撞到周围物体。
    open_clearance_m: 0.0
    # 合爪宽度相对物体宽度收窄的量（单位 m）。靠这 0.012 m 形成夹持预紧力：
    # 太小夹不牢，太大可能顶开或压坏目标。
    close_margin_m: 0.012
    # 夹持力安全下限（归一化）；低于此值夹不紧，容易在抬起时滑落
    min_gripper_effort: 0.22
    # 夹持力安全上限（归一化）；高于此值有过载、堵转报警与压坏目标的风险
    max_gripper_effort: 0.60
    # 允许抓取的最大物体宽度（单位 m）。超过即拒绝该次抓取（fail-closed），
    # 属宽度方向硬闸门；0.085 m 比夹爪最大开口略小，留了余量。
    max_allowed_grasp_width_m: 0.085
    # 合爪阶段是否改用专用抓取服务（堵转推断接触 + 有界保持），而不是普通位置服务。
    # 置 false 会退回纯位置闭合，失去力闭合判据。
    gripper_grasp_enabled: true
    # 抓取服务的闭合夹持力（归一化）；硬件层还会再截断到其允许区间
    gripper_grasp_close_force: 0.4
    # 合爪超时（单位 s）。超时仍未判定堵转即判本次抓取失败；调大容错更久但卡死时反应更慢。
    gripper_grasp_timeout_sec: 8.0
    # 最短合爪时间（单位 s）。防止刚起步、速度尚未建立就被误判为"已接触"。
    gripper_grasp_min_close_time_sec: 0.08
    # 判定"已停住"（堵转）的角速度阈值（单位 rad/s）。低于该值才算接触，
    # 调大更易判定接触（可能误判），调小更难判定（可能超时）。
    gripper_grasp_velocity_threshold: 0.04
    # 判定接触所需的最小闭合行程（单位 m）。行程不足说明夹爪几乎没动，属空夹而非夹到物体。
    gripper_grasp_min_closure_distance_m: 0.006
