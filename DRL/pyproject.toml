[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rebotarm-drl"
version = "0.1.0"
description = "Independent MJLab training, export and evaluation for reBot B601"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "mjlab==1.6.0",
  "mujoco==3.11.0",
  "mujoco-warp==3.11.0",
  "warp-lang==1.14.0",
  "torch==2.9.1+cu128",
  "rsl-rl-lib==5.4.2",
  "onnx>=1.20,<2",
  "onnxruntime>=1.24,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "setuptools==80.9.0", "wheel>=0.45,<1", "pip>=25,<27"]

[project.scripts]
rebot-drl = "rebotarm_drl.cli:main"

[project.entry-points."mjlab.tasks"]
rebotarm_reach_hold = "rebotarm_drl.tasks"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rebotarm_drl = ["assets/**/*", "configs/*.json"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
